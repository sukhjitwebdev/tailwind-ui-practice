<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="../css/output.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"/>

      <title>Testimonial Card Grid</title>
</head>

<body>

    <!-- Testimonials Section -->
     <div class="overflow-hidden bg-inverse">

        <!-- Container -->
        <div class="relative max-w-340 px-4 py-10 sm:px-6 lg:px-8 lg:py-14 mx-auto">
        
        
        <!-- Section Header -->
        <!-- Title -->
        <div class="max-w-2xl w-3/4 lg:w-1/2 mb-6 sm:mb-10 md:mb-16">            
            <h2class="text-2xl sm:text-3xl lg:text-4xl text-foreground-inverse font-semibold"> 
            Loved by business and individuals across the globe
        </h2>    

        </div>
         <!-- End Title -->
         <!-- End Section Header -->


          <!-- Quote Section -->
           <!-- Main Cards Grid -->
        <div class ="grid sm:grid-cols-2 lg:grid-cols-3 gap-6">
           
            <!-- First Card -->
             <div class="flex h-auto">
                <div class=" flex flex-col bg-card rounded-xl">
            
            <div class="flex-auto p-4 md:p-6">
                <p class="text-base italic md:text-lg" text-foreground">
                "Refreshing and thought-provoking design. It changed my view on website design."
                </p>
            </div>




        <!-- User Info -->
        <div class="p-4 bg-surface rounded-b-xl md:px-7">

            <div class="flex items-center gap-x-3">

            <!-- Avatar -->
            <div class="shrink-0">
            <img class="size-8 sm:size-11.5 rounded-full"  src=" https://images.unsplash.com/photo-1492562080023-ab3db95bfbce?ixlib=rb-4.0.3&ixid=MnwxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8&auto=format&fit=facearea&facepad=2&w=320&h=320&q=80" alt="Avatar">
            </div>

            <!-- Name & Designation -->
            <div class="grow">
            <p class="text-sm sm:text-base font-semibold text-foreground">Josh Tyson</p>
            <p class="text-xs text-muted-foreground-1">Entrepreneur | Happy Customer</p>
            </div>

            </div>

                </div>
            </div>
        </div>
    </div>        
        <!-- End Testimonial Card -->
       
    







    </div> 
     <!-- Cards End Grid -->





        </div>

    </div>
     <!-- Testimonials Section -->

    
     
     
    
</body>
</html>
